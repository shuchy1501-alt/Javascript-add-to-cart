<!DOCTYPE html>
<html lang="en"><head>
    <script>document.documentElement.setAttribute("data-bs-theme", localStorage.getItem("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"))</script>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🛍️%3C/text%3E%3C/svg%3E">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/theme.css">
    <title>ShopEase | Checkout</title>
</head>
<body data-page="checkout">
<div id="site-nav"></div>
<div class="container py-4">
  <h4 class="mb-4">Checkout</h4>
  <div class="row g-4">
    <div class="col-lg-7">
      <form id="checkout-form" class="bg-white rounded-3 shadow-sm p-4" novalidate>
        <h6 class="mb-3">Delivery details</h6>
        <div class="row g-3">
          <div class="col-md-6"><label class="form-label">Full name</label><input name="name" class="form-control" required minlength="3" autocomplete="name"><div class="invalid-feedback">Please enter your name.</div></div>
          <div class="col-md-6"><label class="form-label">Phone</label><input name="phone" class="form-control" required pattern="01[3-9][0-9]{8}" placeholder="01XXXXXXXXX" autocomplete="tel"><div class="invalid-feedback">Enter a valid 11-digit mobile number.</div></div>
          <div class="col-12"><label class="form-label">Email <span class="text-muted">(optional)</span></label><input name="email" type="email" class="form-control" autocomplete="email"><div class="invalid-feedback">Enter a valid email.</div></div>
          <div class="col-md-8"><label class="form-label">Address</label><input name="address" class="form-control" required minlength="8" autocomplete="street-address"><div class="invalid-feedback">Please enter your full address.</div></div>
          <div class="col-md-4"><label class="form-label">City</label><input name="city" class="form-control" required value="Dhaka"><div class="invalid-feedback">Required.</div></div>
          <div class="col-12"><label class="form-label">Order note <span class="text-muted">(optional)</span></label><textarea name="note" rows="2" class="form-control"></textarea></div>
        </div>
        <h6 class="mt-4 mb-3">Payment method</h6>
        <div class="d-flex flex-column gap-2">
          <label class="border rounded p-3"><input type="radio" class="form-check-input me-2" name="pay" value="cod" checked> Cash on delivery</label>
          <label class="border rounded p-3"><input type="radio" class="form-check-input me-2" name="pay" value="bkash"> bKash</label>
          <div id="pay-bkash" class="d-none ps-3"><label class="form-label small">bKash Transaction ID</label><input name="trx" class="form-control" pattern="[A-Za-z0-9]{8,12}" placeholder="e.g. 8N7A6D5EE"><div class="invalid-feedback">Enter your 8-12 character TrxID.</div></div>
          <label class="border rounded p-3"><input type="radio" class="form-check-input me-2" name="pay" value="card"> Credit / Debit card <small class="text-muted">(demo, nothing is charged)</small></label>
          <div id="pay-card" class="d-none ps-3"><div class="row g-2">
            <div class="col-12"><input name="cardno" class="form-control" pattern="[0-9 ]{15,19}" placeholder="Card number" inputmode="numeric" autocomplete="off"><div class="invalid-feedback">Enter a valid card number.</div></div>
            <div class="col-6"><input name="exp" class="form-control" pattern="(0[1-9]|1[0-2])\/[0-9]{2}" placeholder="MM/YY"><div class="invalid-feedback">Use MM/YY.</div></div>
            <div class="col-6"><input name="cvv" class="form-control" pattern="[0-9]{3,4}" placeholder="CVV" type="password" autocomplete="off"><div class="invalid-feedback">3-4 digits.</div></div>
          </div></div>
        </div>
        <button class="btn btn-primary w-100 mt-4 py-2" id="place-order" type="submit">Place order</button>
        <a href="cart.html" class="d-block text-center mt-3 small">&larr; Back to cart</a>
      </form>
    </div>
    <div class="col-lg-5"><div class="bg-white rounded-3 shadow-sm p-4 position-sticky" style="top:90px">
      <h6 class="mb-3">Your order</h6><div id="sum-items"></div><hr><div id="sum-rows"></div>
    </div></div>
  </div>
</div>
<div id="site-footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/common.js"></script>
<script src="js/checkout.js"></script>
</body></html>
